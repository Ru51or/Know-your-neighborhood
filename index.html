<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | اعرف حيك</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">

  <main class="login-wrap">
    <div class="login-card">

      <!-- الجهة اليمنى: نموذج تسجيل الدخول -->
      <section class="login-card__form">
        <h1 class="login-card__title">تسجيل الدخول</h1>

        <form id="loginForm" novalidate>

          <div class="form-alert"></div>

          <div class="field">
            <label class="field__label" for="username">اسم المستخدم</label>
            <div class="input-box">
              <span class="input-box__icon">👤</span>
              <input type="text" id="username" name="username" placeholder="أدخل إسم المستخدم" autocomplete="username">
            </div>
            <p class="field__error" data-error-for="username" role="alert"></p>
          </div>

          <div class="field">
            <label class="field__label" for="password">الرمز السري</label>
            <div class="input-box">
              <span class="input-box__icon">🔒</span>
              <input type="password" id="password" name="password" placeholder="أدخل الرمز السري" autocomplete="current-password">
            </div>
            <p class="field__error" data-error-for="password" role="alert"></p>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn--light">تسجيل الدخول</button>
          </div>
        </form>
      </section>

      <!-- الجهة اليسرى: الشعار -->
      <aside class="login-card__brand">
        <img src="assets/logo.png" alt="شعار منصة اعرف حيك">
      </aside>

    </div>
  </main>

  <footer class="footer">
    <div class="footer__inner">
      <div>
        <nav class="footer__links">
          <a href="#">خريطة الموقع</a>
          <a href="#">الأسئلة الشائعة</a>
        </nav>
        <p class="footer__copy">جميع الحقوق محفوظة © لأمانة المنطقة الشرقية - المملكة العربية السعودية</p>
      </div>
      <div>
        <p class="footer__social-title">تابعنا على</p>
        <div class="footer__social">
          <a href="#" aria-label="إكس">✕</a>
          <a href="#" aria-label="فيسبوك">f</a>
          <a href="#" aria-label="إنستقرام">◎</a>
        </div>
      </div>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
