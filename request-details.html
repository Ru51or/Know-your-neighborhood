<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تفاصيل الطلب | اعرف حيك</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="requestDetails">

  <!-- ===== (Navbar) ===== -->
  <header class="navbar">
    <a class="navbar__brand" href="home.html"><img src="assets/logo.png" alt="اعرف حيك"></a>
    <button class="navbar__toggle" data-action="nav-toggle" aria-label="القائمة">☰</button>
    <nav class="navbar__links">
      <a class="navbar__link is-active" href="requests.html">الطلبات</a>
      <a class="navbar__link " href="neighborhoods.html">الأحياء</a>
      <a class="navbar__link " href="home.html">الرئيسية</a>
    </nav>
    <button class="navbar__logout" data-action="logout">تسجيل الخروج</button>
  </header>

  <main class="page">
    <a class="back-link" href="my-requests.html"> العودة الى الطلبات السابقة ❯ </a>

    <div class="loader" id="loader"></div>

    <div class="detail-card is-hidden" id="detailCard">
      <p class="detail-card__no">رقم الطلب <span id="reqNo">—</span></p>
      <h1 class="detail-card__title" id="reqTitle">—</h1>

      <div class="detail-meta">
        <span class="detail-meta__icon" id="reqTypeIcon">🌳</span>
        <span id="reqType">—</span>
      </div>
      <div class="detail-meta">
        <span class="detail-meta__icon">📍</span>
        <span id="reqHood">—</span>
      </div>

      <hr>

      <div class="detail-section">
        <h2 class="detail-section__head">📋 وصف الطلب</h2>
        <p class="detail-section__text" id="reqDesc">—</p>
      </div>

      <div class="attachments-box">
        <h2 class="detail-section__head">📎 المرفقات</h2>
        <div id="reqFiles"></div>
      </div>
    </div>
  </main>

  <!-- ===== (Footer) ===== -->
  <footer class="footer">
    <div class="footer__inner">
      <div>
        <nav class="footer__links">
          <a href="#">خريطة الموقع</a>
          <a href="#">الأسئلة الشائعة</a>
        </nav>
        <p class="footer__copy">جميع الحقوق محفوظة © لأمانة المنطقة الشرقية - المملكة العربية السعودية</p>
      </div>
      <div>
        <p class="footer__social-title">تابعنا على</p>
        <div class="footer__social">
          <a href="#" aria-label="إكس">✕</a>
          <a href="#" aria-label="فيسبوك">f</a>
          <a href="#" aria-label="إنستقرام">◎</a>
        </div>
      </div>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
